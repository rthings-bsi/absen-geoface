<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Absensi - Government Authority Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="theme-config">
    :root {
      --font-inter: 'Inter', sans-serif;
      --color-primary: #3730a3;
      --color-primary-light: #e0e7ff;
      --color-surface: #f7f9fb;
      --color-surface-container: #ffffff;
      --color-text-main: #1f2937;
      --color-text-muted: #6b7280;
      --color-success: #10b981;
      --color-info: #3b82f6;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
    }

    body {
      font-family: var(--font-inter);
      background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #eef2ff 100%);
      background-attachment: fixed;
      color: var(--color-text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Mesh Gradient Overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 50%, rgba(55, 48, 163, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 40px -10px rgba(55, 48, 163, 0.08), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
  </style>
<style data-purpose="custom-components">
    .camera-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(55, 48, 163, 0.1);
      background: rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
    }
    
    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.8), transparent);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
      top: 0;
      left: 0;
      animation: scan 3s infinite linear;
      display: none;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    
    .face-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 70%;
      border: 2px solid rgba(59, 130, 246, 0.4);
      border-radius: 50%;
      display: none;
    }

    /* Animated Corner Brackets for Scanner */
    .scanner-bracket {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: rgba(59, 130, 246, 0.8);
      border-style: solid;
      display: none;
      transition: all 0.3s ease;
    }
    .scanner-bracket.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .scanner-bracket.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .scanner-bracket.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .scanner-bracket.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .rounded-theme { border-radius: 0.75rem; }
    .rounded-theme-xl { border-radius: 1.5rem; }
    
    /* Live Indicator */
    .live-dot {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#3730a3',
              light: '#e0e7ff',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="pb-6">
<!-- BEGIN: TopAppBar -->
<header class="sticky top-0 z-50 glass-card px-6 py-4 flex items-center justify-between border-b border-white/40">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center text-gray-600 hover:text-primary hover:bg-white/50 transition-all rounded-full border border-transparent hover:border-white/60">
<i class="fa-solid fa-chevron-left text-lg"></i>
</button>
<div>
<h1 class="text-2xl font-extrabold tracking-tight text-gray-900 leading-none mb-1">Absensi</h1>
<p class="text-[13px] font-medium text-gray-500">Verifikasi otoritas</p>
</div>
</div>
<!-- Status Indicator -->
<div class="flex flex-col items-end">
<span class="text-[10px] uppercase tracking-widest font-bold text-gray-400 mb-1">Status Hari Ini</span>
<div class="flex items-center gap-3">
<div class="text-sm font-bold tracking-tight text-gray-900 bg-white/50 px-2 py-1 rounded-md border border-white">
<span>02:11</span>
<span class="text-gray-400 mx-0.5">/</span>
<span class="text-gray-400">--:--</span>
</div>
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-100/50 shadow-sm">
<div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
          Hadir
        </div>
</div>
</div>
</header>
<!-- END: TopAppBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-6 pt-8 pb-24 space-y-8 max-w-lg mx-auto w-full">
<!-- BEGIN: Verifikasi Wajah Card -->
<section class="glass-card rounded-theme-xl p-6" data-purpose="face-verification-section">
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 shadow-sm border border-white">
<i class="fa-solid fa-camera-viewfinder text-xl"></i>
</div>
<div>
<h2 class="text-lg font-bold tracking-tight text-gray-900 mb-0.5">Verifikasi Wajah</h2>
<p class="text-sm text-gray-500 font-medium">Posisikan wajah dalam bingkai</p>
</div>
</div>
<div class="hidden px-2.5 py-1 bg-red-50 rounded-full border border-red-100 flex items-center gap-1.5" id="live-indicator">
<div class="w-2 h-2 rounded-full bg-red-500 live-dot"></div>
<span class="text-[10px] uppercase font-bold text-red-600 tracking-wider">Live</span>
</div>
</div>
<!-- Camera Preview Area -->
<div class="camera-frame w-full aspect-[4/3] rounded-2xl mb-6 flex flex-col items-center justify-center relative">
<!-- Scanner Brackets -->
<div class="scanner-bracket tl"></div>
<div class="scanner-bracket tr"></div>
<div class="scanner-bracket bl"></div>
<div class="scanner-bracket br"></div>
<!-- Placeholder State -->
<div class="text-center z-10 p-6" id="camera-placeholder">
<div class="w-16 h-16 rounded-full bg-white text-indigo-300 flex items-center justify-center mx-auto mb-4 shadow-sm border border-indigo-50">
<i class="fa-solid fa-camera text-2xl"></i>
</div>
<h3 class="text-base font-semibold text-indigo-900 mb-1">Kamera standby</h3>
<p class="text-sm text-gray-500 font-medium">Ketuk tombol di bawah untuk memulai</p>
</div>
<!-- Simulated Active State Elements (Hidden by default) -->
<div class="scan-line"></div>
<div class="face-guide"></div>
</div>
<button class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-700 hover:to-blue-600 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2" id="btn-activate-camera">
<i class="fa-solid fa-camera"></i>
        Aktifkan Kamera
      </button>
</section>
<!-- END: Verifikasi Wajah Card -->
<!-- BEGIN: Aksi Absensi Card -->
<section class="glass-card rounded-theme-xl p-6" data-purpose="attendance-actions-section">
<div class="flex items-center gap-4 mb-6">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-50 to-teal-50 text-teal-600 flex items-center justify-center shrink-0 shadow-sm border border-white">
<i class="fa-solid fa-clock-rotate-left text-xl"></i>
</div>
<div>
<h2 class="text-lg font-bold tracking-tight text-gray-900 mb-0.5">Aksi Absensi</h2>
<p class="text-sm text-gray-500 font-medium">Lakukan absensi saat siap.</p>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-4 mb-8">
<!-- Masuk Button -->
<button class="relative overflow-hidden group flex flex-col items-center justify-center p-6 rounded-2xl bg-gradient-to-br from-emerald-100 to-green-100 text-emerald-900 border border-emerald-200/50 shadow-sm hover:shadow-md transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-10 h-10 rounded-full bg-emerald-200/50 flex items-center justify-center mb-3 text-emerald-700">
<i class="fa-solid fa-right-to-bracket text-lg"></i>
</div>
<span class="font-bold text-xl tracking-tight mb-1">Masuk</span>
<span class="text-[10px] uppercase tracking-widest font-bold text-emerald-700/70">Absen Pagi</span>
</button>
<!-- Pulang Button -->
<button class="relative overflow-hidden group flex flex-col items-center justify-center p-6 rounded-2xl bg-gradient-to-br from-blue-100 to-indigo-100 text-blue-900 border border-blue-200/50 shadow-sm hover:shadow-md transition-all active:scale-[0.98] opacity-50 cursor-not-allowed">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-10 h-10 rounded-full bg-blue-200/50 flex items-center justify-center mb-3 text-blue-700">
<i class="fa-solid fa-right-from-bracket text-lg"></i>
</div>
<span class="font-bold text-xl tracking-tight mb-1">Pulang</span>
<span class="text-[10px] uppercase tracking-widest font-bold text-blue-700/70">Absen Sore</span>
</button>
</div>
<!-- Interactive Stepper Feedback -->
<div class="flex items-center justify-between px-2">
<!-- Wajah Chip -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/60 border border-gray-200 shadow-sm">
<div class="w-2 h-2 rounded-full bg-gray-300"></div>
<span class="text-xs font-semibold text-gray-500">Wajah</span>
</div>
<!-- Connector -->
<div class="h-px flex-1 bg-gradient-to-r from-gray-200 via-blue-200 to-gray-200 mx-2"></div>
<!-- Lokasi Chip -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 border border-blue-200 shadow-sm">
<div class="relative flex items-center justify-center">
<span class="absolute inline-flex h-3 w-3 rounded-full bg-blue-400 opacity-20 animate-ping"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
</div>
<span class="text-xs font-bold text-blue-700">Lokasi</span>
</div>
<!-- Connector -->
<div class="h-px flex-1 bg-gray-200 mx-2"></div>
<!-- Siap Chip -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/60 border border-gray-200 shadow-sm">
<div class="w-2 h-2 rounded-full bg-gray-300"></div>
<span class="text-xs font-semibold text-gray-500">Siap</span>
</div>
</div>
</section>
<!-- END: Aksi Absensi Card -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: NavigationBar (Mock) -->
<nav class="fixed bottom-0 w-full glass-card border-t border-white/40 px-8 py-4 flex justify-between items-center z-50 rounded-t-[2rem] max-w-lg mx-auto left-0 right-0 shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.05)]">
<div class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-colors">
<i class="fa-solid fa-house mb-1.5 text-xl"></i>
<span class="text-[10px] font-bold tracking-wide">Home</span>
</div>
<div class="flex flex-col items-center text-indigo-600 -mt-6">
<div class="w-14 h-14 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 mb-1 border-4 border-[#f4f7fb]">
<i class="fa-solid fa-fingerprint text-2xl"></i>
</div>
<span class="text-[11px] font-extrabold tracking-wide">Absen</span>
</div>
<div class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-colors">
<i class="fa-solid fa-file-lines mb-1.5 text-xl"></i>
<span class="text-[10px] font-bold tracking-wide">Riwayat</span>
</div>
<div class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-colors">
<i class="fa-solid fa-user mb-1.5 text-xl"></i>
<span class="text-[10px] font-bold tracking-wide">Profil</span>
</div>
</nav>
<!-- END: NavigationBar -->
<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const btnActivate = document.getElementById('btn-activate-camera');
      const placeholder = document.getElementById('camera-placeholder');
      const scanLine = document.querySelector('.scan-line');
      const faceGuide = document.querySelector('.face-guide');
      const frame = document.querySelector('.camera-frame');
      const liveIndicator = document.getElementById('live-indicator');
      const brackets = document.querySelectorAll('.scanner-bracket');

      if(btnActivate && placeholder && scanLine) {
        btnActivate.addEventListener('click', function() {
          if(placeholder.style.display !== 'none') {
            // Activate
            placeholder.style.display = 'none';
            scanLine.style.display = 'block';
            faceGuide.style.display = 'block';
            liveIndicator.classList.remove('hidden');
            liveIndicator.classList.add('flex');
            brackets.forEach(b => b.style.display = 'block');
            
            frame.classList.remove('bg-white/40');
            frame.classList.add('bg-slate-900/10'); 
            
            this.innerHTML = '<i class="fa-solid fa-camera-rotate"></i> Ganti Kamera';
            this.className = 'w-full py-4 px-6 bg-white border border-gray-200 hover:bg-gray-50 active:scale-[0.98] text-gray-700 font-semibold rounded-xl shadow-sm transition-all flex items-center justify-center gap-2';
            
          } else {
            // Deactivate
            placeholder.style.display = 'block';
            scanLine.style.display = 'none';
            faceGuide.style.display = 'none';
            liveIndicator.classList.add('hidden');
            liveIndicator.classList.remove('flex');
            brackets.forEach(b => b.style.display = 'none');
            
            frame.classList.add('bg-white/40');
            frame.classList.remove('bg-slate-900/10');

            this.innerHTML = '<i class="fa-solid fa-camera"></i> Aktifkan Kamera';
            this.className = 'w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-700 hover:to-blue-600 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2';
          }
        });
      }
    });
  </script>
</body></html>
